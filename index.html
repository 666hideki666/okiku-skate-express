<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#172d35" />
    <title>オキク スケート配達便</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍪%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell" id="game-shell" aria-label="オキク スケート配達便">
      <audio id="bgm" src="audio/sunny-delivery.mp3" preload="auto" loop></audio>
      <canvas id="game" width="1280" height="720" aria-label="スケート配達ゲーム。右側をタップでジャンプ、左側を押している間しゃがみます"></canvas>
      <div class="loading" id="loading">街とキャラクターを準備中…</div>
      <section class="title-screen" id="title-screen" aria-label="タイトル画面">
        <div class="title-heading">
          <h1>OKIKU<br />SKATE EXPRESS</h1>
          <div class="mode-picker" role="group" aria-label="プレイするモード">
            <button id="mode-normal" type="button" aria-pressed="true">通常版</button>
            <button id="mode-christmas" type="button" aria-pressed="false">❄ クリスマス版</button>
          </div>
          <p class="mode-status" id="mode-status" aria-live="polite"></p>
        </div>
        <div class="title-actions">
          <button id="start" type="button">はじめる <span aria-hidden="true">→</span></button>
          <button class="fullscreen-toggle" id="fullscreen-toggle" type="button" aria-label="ゲームを全画面表示にする" aria-pressed="false">⛶ 全画面</button>
        </div>
      </section>
      <section class="story-screen hidden" id="story-screen" aria-live="polite" aria-label="オープニング">
        <div class="story-caption">
          <p class="story-speaker" id="story-speaker"></p>
          <p class="story-dialogue" id="story-dialogue"></p>
          <p class="story-count" id="story-count"></p>
        </div>
        <div class="story-actions">
          <button id="story-skip" type="button">スキップ</button>
          <button id="story-next" type="button">次へ <span aria-hidden="true">→</span></button>
        </div>
      </section>
      <section class="goal-ui hidden" id="goal-ui" aria-live="polite" aria-label="エンディング">
        <div class="goal-caption hidden" id="goal-caption">
          <p class="goal-success hidden" id="goal-success">配達成功！</p>
          <p class="goal-speaker" id="goal-speaker"></p>
          <p class="goal-dialogue" id="goal-dialogue"></p>
          <p class="goal-count" id="goal-count"></p>
        </div>
        <button class="goal-next hidden" id="goal-next" type="button">次へ <span aria-hidden="true">→</span></button>
        <button class="goal-retry hidden" id="goal-retry" type="button">もう一度配達する <span aria-hidden="true">↻</span></button>
      </section>
      <section class="overlay hidden" id="overlay" aria-live="polite">
        <div class="panel result hidden" id="result">
          <p class="eyebrow" id="result-eyebrow"></p>
          <h2 id="result-title"></h2>
          <p id="result-message"></p>
          <button id="retry" type="button">もう一度配達する <span aria-hidden="true">↻</span></button>
        </div>
      </section>
      <button class="bgm-toggle hidden" id="bgm-toggle" type="button" aria-label="BGMを再生する" aria-pressed="false">♪ BGMを再生</button>
    </main>
    <script src="game.js"></script>
  </body>
</html>
